spring.config.import=optional:classpath:application-secret.properties
spring.application.name=identity
spring.datasource.url=jdbc:postgresql://localhost:5432/deltaglobalbank
spring.datasource.username=${IDENTITY_DB_USER}
spring.datasource.password=${IDENTITY_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '15s'
spring.flyway.enabled=true
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=identity
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.auto-commit=false
identity.jwt.issuer=identity-service
identity.jwt.audience=internal
identity.jwt.access-token-ttl=15m
identity.jwt.refresh-token-ttl=7d
identity.jwt.jwks-url=http://localhost:8080/.well-known/jwks.json
identity.jwt.expected-issuer=identity-service
identity.jwt.expected-audience=internal
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
identity.api-key.environment=${IDENTITY_API_KEY_ENV:test}
identity.api-key.fingerprint-secret=${API_KEY_FINGERPRINT_SECRET:local-dev-secret-1234-deltaglobalbank}
identity.api-key.brand=dgb
identity.grpc.port=9090
identity.grpc.shutdown-grace-seconds=30
# Cache do ExchangeApiKey
identity.exchange-api-key.cache-ttl-margin-seconds=30
identity.security.revocation-check-on=POST,PUT,PATCH,DELETE
identity.security.fail-open-on-redis-error=true
identity.security.lockout.enabled=true
identity.security.lockout.attempts-per-level=5,3,2
identity.security.lockout.durations=5m,15m
# Cache do TenantIpAllowlist
identity.tenant-ip-allowlist.cache-ttl-seconds=300
# Refresh cookie
identity.cors.allowed-origins[0]=${IDENTITY_CORS_ALLOWED_ORIGIN_0:http://localhost:4200}
identity.cors.allowed-origins[1]=${IDENTITY_CORS_ALLOWED_ORIGIN_1:http://localhost:4201}
identity.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
identity.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}