spring.application.name=delta-secure

identity.jwt.jwks-url=${IDENTITY_JWKS_URL:http://localhost:8080/.well-known/jwks.json}
heroseguros.base-url=${HEROSEGUROS_BASE_URL:https://api.homologacao.heroseguros.com.br}
heroseguros.prestamista.type-of-product.clt=${HEROSEGUROS_PRESTAMISTA_TYPE_OF_PRODUCT_CLT:9}
heroseguros.prestamista.type-of-product.prefeituras=${HEROSEGUROS_PRESTAMISTA_TYPE_OF_PRODUCT_PREFEITURAS:10}
heroseguros.prestamista.type-of-product.siape=${HEROSEGUROS_PRESTAMISTA_TYPE_OF_PRODUCT_SIAPE:11}

sworks.base-url=${SWORKS_BASE_URL:https://sworkshml-delta.simply.com.br/SWorks.WebApi}
sworks.auth.username=${SWORKS_USERNAME:}
sworks.auth.password=${SWORKS_PASSWORD:}
sworks.auth.grant-type=${SWORKS_GRANT_TYPE:password}
sworks.verify-after-upload=${SWORKS_VERIFY_AFTER_UPLOAD:true}
sworks.processo.codigo-workflow=${SWORKS_PROCESSO_CODIGO_WORKFLOW:}
sworks.processo.cd-produto=${SWORKS_PROCESSO_CD_PRODUTO:}
sworks.processo.tipo-operacao=${SWORKS_PROCESSO_TIPO_OPERACAO:}
sworks.documento.formulario=${SWORKS_DOCUMENTO_FORMULARIO:SEGURO PRESTAMISTA}

backoffice.base-url=${BACKOFFICE_BASE_URL:}
backoffice.auth.username=${BACKOFFICE_USERNAME:}
backoffice.auth.password=${BACKOFFICE_PASSWORD:}

document-storage.base-url=${DOCUMENT_STORAGE_BASE_URL:http://localhost:8082}

server.port=8082
spring.datasource.url=${DELTA_SECURE_DB_URL:jdbc:postgresql://localhost:5432/deltaglobalbank}
spring.datasource.username=${DELTA_SECURE_DB_USER:postgres}
spring.datasource.password=${DELTA_SECURE_DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.schemas=delta_secure
spring.flyway.default-schema=delta_secure
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.default_schema=delta_secure

spring.config.import=optional:file:${DELTA_SECURE_SECRET_FILE:${user.home}/.deltabackend/delta-secure/application-secret.properties}

feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=8000
feign.client.config.sworks-document.connect-timeout=3000
feign.client.config.sworks-document.read-timeout=15000
