spring.config.import=optional:classpath:application-secret.properties
spring.application.name=products
server.port=8082
identity.jwt.jwks-url=${IDENTITY_JWT_JWKS_URL}
spring.datasource.url=jdbc:postgresql://localhost:5432/deltaglobalbank
spring.datasource.username=${PRODUCTS_DB_USER:postgres}
spring.datasource.password=${PRODUCTS_DB_PASSWORD:postgres}
spring.flyway.schemas=products
spring.flyway.default-schema=products
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.default_schema=products
spring.jpa.open-in-view=false
products.grpc.port=9092
products.grpc.shutdown-grace-seconds=30